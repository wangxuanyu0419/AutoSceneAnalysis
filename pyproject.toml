[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoscene-analysis"
version = "0.1.0"
description = "Object and action menus for an environment-aware neural interface"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "transformers==4.57.1",
    "numpy==1.26.4",
    "Pillow==11.3.0",
    "jsonschema>=4.23,<5",
]

[project.scripts]
autoscene = "autoscene.cli:main"

[project.optional-dependencies]
reconstruction = ["scipy==1.15.3", "opencv-python-headless==4.11.0.86"]

[tool.setuptools.packages.find]
where = ["src"]
